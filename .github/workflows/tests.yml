name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "opencv-python-headless<5" numpy pandas scikit-learn matplotlib pytest fastapi python-multipart httpx
      - name: Run tests (synthetic data, no FF++ videos)
        run: pytest -q tests
